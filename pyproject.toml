[project]
name = "projet-eco-agronomist-ia-backend"
version = "0.1.0"
description = "Backend pour l'IA Eco-Agronomist"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "dotenv>=0.9.9",
    "kagglehub>=1.0.0",
    "onnxruntime>=1.20.0",
    "onnxslim>=0.1.87",
    "torch>=2.4.0",           # Version compatible Python 3.12
    "torchvision>=0.19.0",    # Aligné avec torch 2.4+
    "ultralytics>=8.3.0",
    "easyocr>=1.7.2",
    "fastapi>=0.115.0",
    "icrawler>=0.6.10",
    "imagehash>=4.3.2",
    "kaggle==2.0.0",
    "kagglesdk==0.1.15",
    "matplotlib>=3.9.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "mlflow>=2.15.0",
    "opencv-python>=4.10.0",
    "pandas>=2.2.0",
    "passlib[argon2]>=1.7.4",
    "pillow>=10.4.0",
    "pinecone>=5.0.0",
    "playwright>=1.45.0",
    "protobuf<5",
    "psycopg2-binary>=2.9.9",
    "python-jose>=3.3.0",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "sentence-transformers>=3.0.0",
    "setuptools<82",
    "sqlalchemy>=2.0.30",
    "supabase>=2.5.0",
    "tqdm>=4.66.0",
    "transformers>=4.44.0",
    "uvicorn>=0.30.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
]

# --- CONFIGURATION SPECIFIQUE POUR UV (FORCE LE CPU) ---

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
# Optionnel : aide à la résolution sur Linux
environments = ["sys_platform == 'linux'"]