services:
  # --- BASE DE DONNÉES (Infrastructure) ---
  postgres:
    image: postgres:16
    container_name: eco_agri_db
    environment:
      POSTGRES_USER: ${DB_USER:-airflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-airflow}
      POSTGRES_DB: ${DB_NAME:-airflow}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER:-airflow}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eco_network

  # --- INITIALISATION D'AIRFLOW (Run Once) ---
  airflow-init:
    build:
      context: .
      dockerfile: data-processing/Dockerfile.airflow
    container_name: airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-airflow}:${DB_PASSWORD:-airflow}@postgres/${DB_NAME:-airflow}
    command: >
      bash -c "
        sleep 5 &&
        airflow db init &&
        airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin || true
      "
    networks:
      - eco_network

  # --- MICROSERVICE 1 : DATA FACTORY (Airflow + Spark) ---
  airflow:
    build:
      context: .
      dockerfile: data-processing/Dockerfile.airflow
    container_name: airflow_spark_service
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "local[*]", "extra": {"queue": "root"}}'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-airflow}:${DB_PASSWORD:-airflow}@postgres/${DB_NAME:-airflow}
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
      KAGGLE_USERNAME: ${KAGGLE_USERNAME}
      KAGGLE_KEY: ${KAGGLE_KEY}
    volumes:
      - ./data-processing/airflow/dags:/opt/airflow/dags
      - ./data-processing/airflow/tasks:/opt/airflow/tasks
      - ./data:/opt/airflow/data # Volume Medallion
      - ./logs/airflow:/opt/airflow/logs
    ports:
      - "8081:8080"
    command: >
      bash -c "airflow webserver --port 8080"
    networks:
      - eco_network
  airflow-scheduler:
    build:
      context: .
      dockerfile: data-processing/Dockerfile.airflow
    container_name: airflow_scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    volumes:
      - ./data-processing/airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
    command: scheduler
    networks:
      - eco_network
  # # --- MICROSERVICE 2 : API & INFERENCE (FastAPI) ---
  # api-service:
  #   build:
  #     context: .
  #     dockerfile: services/api-inference-service/Dockerfile.api
  #   container_name: fastapi_inference_service
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./services/api-inference-service/src:/app/src
  #     - ./data/gold:/app/data/gold         # Accès aux data Gold pour rapports
  #   ports:
  #     - "8000:8000"
  #   networks:
  #     - eco_network

networks:
  eco_network:
    driver: bridge

volumes:
  postgres_data:
